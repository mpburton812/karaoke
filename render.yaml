# Karaoke Companion — single Node web service (API + production frontend).
# Apply via Render Dashboard → Blueprints, or connect this repo to a Web Service.
#
# Required secrets (Dashboard → Environment): TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, JWT_SECRET

services:
  - type: web
    name: karaoke-companion
    runtime: node
    plan: free
    branch: main
    # NODE_ENV=production omits devDependencies; Vite/tsc need them at build time.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: SERVE_STATIC
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
